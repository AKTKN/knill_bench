[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knill-bench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.3", "scipy==1.18.1", "stim==1.16.0", "pymatching==2.4.0", "ldpc==2.4.1", "PyYAML==6.0.3", "pyarrow==25.0.1", "matplotlib==3.11.2", "hex-qec @ git+https://github.com/AKTKN/Hex.git@4278d2900626f1d120d611f209340b20a9370f91", "lomatching @ git+https://github.com/AKTKN/lomatching.git@b55a7a65969a106a547622287b620f0da2cb5e39", "surface-sim @ git+https://github.com/AKTKN/surface-sim.git@493f800a3b4e9f80a6a569eb92d3c962dd6b09ad"]

[project.scripts]
knill-bench = "knill_bench.cli:main"
knill-bench-v2 = "knill_bench.experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
