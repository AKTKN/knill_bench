# Small B2 two-stage execution example; theta is for later offline analysis.
schema_version: 2
kind: logical_zero_factory
name: factory_v2_example
output_root: results
code: rotated_surface
noise: hex_uniform
sweep:
  d: [3, 5, 7]
  p: [0.005, 0.003,0.001]
r_0: d
r_plus: d
T_tel: 2
theta: 1.0  # Saved analysis cut; never controls sampling or selects truth.
create_codecapacity_dem: true
decoder: mwpm
shots: 100
batch_size: auto      # Time-adaptive compute chunks; integer retains fixed mode.
buffer_shot: 10000    # Write this many result rows at a time (last group may be short).
target_chunk_seconds: 1.0 # Target sampling + decoding time, excluding model setup.
workers: 6
master_seed: 12345
