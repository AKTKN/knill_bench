schema_version: 1
experiment:
  name: four_protocol_benchmark
  master_seed: 12345
  output_root: results
  code: rotated_surface
  distances: [5, 7, 9, 11]
  bases: [z]
  physical_error_rates: [0.001, 0.002, 0.003, 0.004]
  cycles_per_distance: [1]
  replicates: 1
  initial_boundary: {kind: ideal_encoded}
  final_readout: noisy_destructive
  comparison: {kind: equal_cycles}
noise: {profile: hex_legacy}
decoders:
  mwpm: {kind: pymatching}
  lom: {kind: lomatching, on_nonmatchable: bplsd_global, fallback_decoder: global_lsd}
  global_lsd: {kind: bplsd_global, max_iter: 100, bp_method: minimum_sum, ms_scaling_factor: 0.75, schedule: parallel, lsd_method: LSD_0, lsd_order: 0}
  hex_native: {kind: hex_native_pipeline, prior_policy: legacy}
protocols:
  - {id: se_memory, decoders: [mwpm]}
  - {id: knill_hex_dminus2, prep_rounds: {rule: d_minus_2}, decoders: [hex_native]}
  - {id: knill_aft_postgate, prep_rounds: 1, post_gate_rounds: 1, post_gate_scope: all_active, decoders: [lom]}
  - {id: knill_aft_prep_only, prep_rounds: 1, post_gate_rounds: 0, decoders: [lom]}
sampling: {workers: 6, shots_per_case: 10000, chunk_size: 2000, stop_rule: fixed_shots, max_pending_chunks_per_worker: 1, native_threads_per_worker: 1}
timing: {collect_batch_times: true, latency_sample_count_per_case: 1000, latency_sampling: deterministic_uniform, warmup_shots: 32, isolated_replay_workers: 1}
storage: {format: parquet, compression: zstd, save_shot_results: true, save_decoder_calls: true, save_all_syndromes: false, retained_failure_samples_per_case: 100, retained_uniform_samples_per_case: 100}
diagnostics: {bp_lsd_stats: sampled, structural_metrics: true}
