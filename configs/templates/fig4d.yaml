# SMALL B1 execution template, not statistical paper validation.
# Deliberate production d=9/11/15/21, approximate p=.004..010 is configs/fig4d.yaml.
schema_version: 2
kind: fig4d_reproduction
name: my_fig4d
output_root: results
code: rotated_surface
noise: hex_uniform
sweep:
  d: [3, 5]
  p: [0.0, 0.001]
r_0: d                # Standard paper depth; also accepts "2*d" or "2/3*d" (floor).
r_plus: d             # Plus resource depth; same round-rule syntax, result >=1.
T_tel: 8              # Required for this runner; fixed across the run.
theta: null           # Fig.4(d) retains every shot.
create_codecapacity_dem: false  # Required original Hamming online priors.
decoder: mwpm
shots: 64
batch_size: auto      # Time-adaptive compute chunks; integer retains fixed mode.
buffer_shot: 10000    # Write this many result rows at a time (last group may be short).
target_chunk_seconds: 1.0 # Target sampling + decoding time, excluding model setup.
workers: 1
master_seed: 12345
