# Tiny general Knill EC example; no production sweep.
schema_version: 2
kind: knill_sim
name: knill_full_prefix_smoke
output_root: results
noise: hex_uniform
sweep:
  d: [3]
  p: [0.001]
r_0: 1
r_plus: 1
T_tel: 1
create_codecapacity_dem: true
codecapacity_prior: full_prefix
decoder: mwpm
shots: 3
batch_size: 3  # Integer gives fixed-partition replay; auto adapts to wall time.
buffer_shot: 3
workers: 1
master_seed: 12345
